<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - MyShop Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="checkout-page">

<div class="checkout-box">
  <h1>📦 Your Orders</h1>

  <div id="orders-container"></div>

  <button onclick="clearOrders()" style="background:#dc3545;margin-top:10px;">
    Clear Orders
  </button>

  <a href="index.html">⬅ Back to Home</a>
</div>

<script>

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let container = document.getElementById("orders-container");

function loadOrders() {

  if (orders.length === 0) {
    container.innerHTML = "<p style='text-align:center;'>No orders yet 😔</p>";
    return;
  }

  container.innerHTML = "";

  // Latest order first
  orders.slice().reverse().forEach(order => {

    let div = document.createElement("div");

    div.style.border = "1px solid #ddd";
    div.style.padding = "12px";
    div.style.margin = "10px 0";
    div.style.borderRadius = "8px";
    div.style.background = "#f9f9f9";

    let items = order.items.map(item => {
      return item.name + " x" + item.qty;
    }).join(", ");

    div.innerHTML = `
      <h3 style="color:#28a745;">Order ID: ${order.id}</h3>
      <p><b>Name:</b> ${order.name}</p>
      <p><b>Items:</b> ${items}</p>
      <p><b>Total:</b> ₹${order.total}</p>
      <p><b>Date:</b> ${order.date}</p>
    `;

    container.appendChild(div);
  });
}

function clearOrders() {
  if (confirm("Delete all orders?")) {
    localStorage.removeItem("orders");
    orders = [];
    loadOrders();
  }
}

loadOrders();

</script>

</body>
</html>

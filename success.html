
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success - MyShop Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="success-page">

<div class="success-box">
  <h1 style="color: green;">✅ Order Placed!</h1>

  <p>Thank you, <b id="order-name"></b> 🎉</p>

  <h3>Your Order ID:</h3>
  <h2 class="order-id" id="order-id"></h2>

  <h3>Total Paid: ₹<span id="order-total"></span></h3>

  <button onclick="goHome()">Continue Shopping</button>
  <a href="index.html">Back to Home</a>
</div>

<script>
document.getElementById("order-id").innerText = localStorage.getItem("lastOrderId") || "ORD000000";
document.getElementById("order-name").innerText = localStorage.getItem("lastOrderName") || "Customer";
document.getElementById("order-total").innerText = localStorage.getItem("lastOrderTotal") || "0";

function goHome() {
  window.location.href = "index.html";
}
</script>

</body>
</html>

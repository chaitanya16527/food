<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery App</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    🍔 Food Delivery App
</header>

<div class="container">

    <!-- Food Items -->
    <div class="card">
        <h3>Pizza</h3>
        <p>₹199</p>
        <button onclick="addToCart('Pizza',199)">Add to Cart</button>
    </div>

    <div class="card">
        <h3>Burger</h3>
        <p>₹99</p>
        <button onclick="addToCart('Burger',99)">Add to Cart</button>
    </div>

    <div class="card">
        <h3>Biryani</h3>
        <p>₹149</p>
        <button onclick="addToCart('Biryani',149)">Add to Cart</button>
    </div>

    <!-- Cart Section -->
    <div class="cart">
        <h2>🛒 Cart</h2>

        <ul id="cart-list"></ul>

        <h3>Total: ₹<span id="total">0</span></h3>
    </div>

</div>

<!-- JS file -->
<script src="script.js"></script>

</body>
</html>

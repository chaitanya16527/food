<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShop Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">🛒 MyShop Pro</div>

  <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProduct()">

  <button onclick="applyCoupon()">Coupon</button>
  <button onclick="goToLogin()">Login</button>

  <div class="nav-total">
    Total: ₹<span id="nav-total">0</span>
  </div>
</header>

<section class="hero">
  <h1>Best Deals Today</h1>
  <p>Shop smart. Save more.</p>
</section>

<main class="products">

  <div class="product">
    <img src="https://cdn-icons-png.flaticon.com/512/545/545245.png">
    <h3>Phone</h3>
    <p>₹15000</p>
    <button onclick="addToCart('Phone',15000)">Add</button>
  </div>

  <div class="product">
    <img src="https://cdn-icons-png.flaticon.com/512/3474/3474360.png">
    <h3>Laptop</h3>
    <p>₹55000</p>
    <button onclick="addToCart('Laptop',55000)">Add</button>
  </div>

  <div class="product">
    <img src="https://cdn-icons-png.flaticon.com/512/1048/1048953.png">
    <h3>Headphones</h3>
    <p>₹2000</p>
    <button onclick="addToCart('Headphones',2000)">Add</button>
  </div>

</main>

<section class="cart">
  <h2>🛒 Your Cart</h2>
  <ul id="cart-list"></ul>

  <p>Subtotal: ₹<span id="subtotal">0</span></p>
  <p>Discount: ₹<span id="discount">0</span></p>
  <h3>Total: ₹<span id="final-total">0</span></h3>

  <button onclick="checkout()">Checkout</button>
  <button onclick="clearCart()">Clear</button>
</section>

<script src="script.js"></script>
</body>
</html>

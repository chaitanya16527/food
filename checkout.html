<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - MyShop Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-page">

<div class="checkout-box">
  <h1>🛒 Checkout</h1>

  <h2>Order Summary</h2>
  <ul id="checkout-list"></ul>

  <h3>Total: ₹<span id="checkout-total">0</span></h3>

  <h2>Customer Details</h2>
  <input type="text" id="customerName" placeholder="Full Name">
  <input type="text" id="customerPhone" placeholder="Phone Number">
  <textarea id="customerAddress" placeholder="Delivery Address"></textarea>

  <button onclick="placeOrder()">Place Order</button>
  <a href="index.html">Back to Home</a>
</div>

<script>
let checkoutCart = JSON.parse(localStorage.getItem("cart")) || [];
let checkoutDiscount = Number(localStorage.getItem("discountAmount")) || 0;

function loadCheckout() {
  const list = document.getElementById("checkout-list");
  let subtotal = 0;
  list.innerHTML = "";

  checkoutCart.forEach(item => {
    subtotal += item.price * item.qty;
    const li = document.createElement("li");
    li.innerText = item.name + " - ₹" + item.price + " x " + item.qty;
    list.appendChild(li);
  });

  document.getElementById("checkout-total").innerText = subtotal - checkoutDiscount;
}

function placeOrder() {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  if (checkoutCart.length === 0) {
    alert("Your cart is empty!");
    window.location.href = "index.html";
    return;
  }

  if (name === "" || phone === "" || address === "") {
    alert("Please fill all details");
    return;
  }

  const orderId = "ORD" + Math.floor(Math.random() * 1000000);
  const total = document.getElementById("checkout-total").innerText;

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  orders.push({
    id: orderId,
    name: name,
    phone: phone,
    address: address,
    total: total,
    items: checkoutCart,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("orders", JSON.stringify(orders));

  localStorage.setItem("lastOrderId", orderId);
  localStorage.setItem("lastOrderName", name);
  localStorage.setItem("lastOrderTotal", total);

  localStorage.removeItem("cart");
  localStorage.removeItem("discountAmount");

  window.location.href = "success.html";
}

loadCheckout();
</script>

</body>
</html>
